<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clan - Inferno Legions</title>
  <link rel="icon" type="image/png" href="assets/troops/badge.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { margin: 0; padding: 0; background-color: #f4f7f6; }
    
    .clan-showcase {
      position: relative;
      width: 100%;
      height: 60vh;
      min-height: 500px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-bottom: 2px solid rgba(255,204,0,0.3);
    }
    
    .clan-showcase-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('assets/bg/village_bg.jpg') center/cover no-repeat;
      filter: brightness(0.6) saturate(1.2);
      z-index: 0;
    }

    /* Clan XP Badge for the Showcase */
    .showcase-xp-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 90px;
      height: 90px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%234fc3f7" stroke="%2301579b" stroke-width="6"/><polygon points="50,5 61,25 82,18 78,40 95,50 78,60 82,82 61,75 50,95 39,75 18,82 22,60 5,50 22,40 18,18 39,25" fill="%2329b6f6" stroke="%2301579b" stroke-width="4"/><polygon points="50,15 58,30 75,25 71,42 85,50 71,58 75,75 58,70 50,85 42,70 25,75 29,58 15,50 29,42 25,25 42,30" fill="%2381d4fa"/></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      font-family: var(--font-coc);
      font-size: 42px;
      color: white;
      text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
      position: relative;
      z-index: 2;
    }

    .showcase-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
      flex-wrap: wrap;
    }

    .showcase-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .showcase-title {
      font-family: var(--font-coc);
      font-size: clamp(3rem, 6vw, 6rem);
      color: white;
      letter-spacing: 2px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.9);
      margin: 0;
      line-height: 1;
    }
    .showcase-title span { color: #ffeb3b; }

    .showcase-subtitle {
      font-family: "Nunito", sans-serif;
      font-size: 1.5rem;
      color: #ffd54f;
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.5);
      padding: 5px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,213,79, 0.3);
    }

    .capital-hall-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .capital-hall-img {
      height: 160px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
      transition: transform 0.3s ease;
    }
    .capital-hall-img:hover {
      transform: scale(1.05) translateY(-5px);
    }
    
    .capital-hall-label {
      font-family: var(--font-coc);
      color: white;
      font-size: 1.2rem;
      text-shadow: 2px 2px 0px #000;
      background: rgba(0,0,0,0.6);
      padding: 4px 12px;
      border-radius: 8px;
      border-bottom: 2px solid #ffcc00;
    }

    /* Clan Stats Strip */
    .clan-stats-strip {
      background: linear-gradient(to right, #050505, #111, #050505);
      border-bottom: 2px solid rgba(255,255,255,0.05);
      padding: 1.5rem 0;
      display: flex;
      justify-content: center;
      gap: 4rem;
      position: relative;
      z-index: 3;
      flex-wrap: wrap;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .strip-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }
    .strip-stat-value {
      font-family: var(--font-coc);
      font-size: 2.2rem;
      color: white;
      text-shadow: 1px 1px 0 #000;
    }
    .strip-stat-label {
      font-family: "Nunito", sans-serif;
      font-size: 0.9rem;
      color: #90a4ae;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <!-- ========== CLAN SHOWCASE ========== -->
  <section class="clan-showcase cinematic-header">
    <div class="clan-showcase-bg"></div>
    
    <!-- Moving Troops Removed -->
    <div class="showcase-content">
      <!-- Left side: Clan Badge & XP -->
      <div class="showcase-center" style="gap: 0;">
        <img src="assets/troops/badge.png" class="api-clan-badge" alt="Clan Badge" style="width: 140px; height: 140px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));">
        <div class="showcase-xp-badge" id="api-clan-level" style="margin-top: -30px; z-index: 5;">4</div>
      </div>

      <!-- Center: Title -->
      <div class="showcase-center">
        <h1 class="showcase-title">INFERNO <span>LEGIONS</span></h1>
        <div class="showcase-subtitle">Elite War Clan</div>
      </div>

      <!-- Right side: Capital Hall -->
      <div class="capital-hall-container">
        <!-- We use a fallback TH 13 image if Capital Hall image isn't available, or rely on script to set it -->
        <div class="th-fallback-badge" id="api-capital-fallback" style="display: none; width: 140px; height: 140px; border-color: #ffcc00; box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);">
          <div class="th-number">CH <span id="api-capital-level">10</span></div>
        </div>
        <img src="assets/townhalls/Capital_Hall_10.png" id="api-capital-img" class="capital-hall-img" alt="Capital Hall" onerror="this.style.display='none'; document.getElementById('api-capital-fallback').style.display='flex';">
        <div class="capital-hall-label" id="api-capital-label">Capital Hall 10</div>
      </div>
    </div>
  </section>

  <!-- Clan Stats Strip -->
  <div class="clan-stats-strip">
    <div class="strip-stat">
      <span class="strip-stat-value" id="api-members-count">50/50</span>
      <span class="strip-stat-label">Members</span>
    </div>
    <div class="strip-stat">
      <span class="strip-stat-value" style="color: #ffcc00;" id="api-clan-points">35,000</span>
      <span class="strip-stat-label">Clan Points</span>
    </div>
    <div class="strip-stat">
      <span class="strip-stat-value" style="color: #4caf50;" id="api-war-wins">150</span>
      <span class="strip-stat-label">War Wins</span>
    </div>
  </div>

  <!-- ========== MEMBERS ========== -->
  <section class="section members-section" id="members">
    <div class="container">
      <div class="section-header" style="text-align: center; margin-top: 3rem; margin-bottom: 3rem;">
        <h2 class="section-title" style="font-size: 3rem;">Clan Roster</h2>
        <p class="section-subtitle">Meet the warriors of Inferno Legions</p>
      </div>

      <div class="filter-bar">
        <div class="filter-group">
          <button class="filter-btn active" data-role="all">All</button>
          <button class="filter-btn" data-role="leader">Leader</button>
          <button class="filter-btn" data-role="coLeader">Co-Leader</button>
          <button class="filter-btn" data-role="admin">Elder</button>
          <button class="filter-btn" data-role="member">Member</button>
        </div>
        <select class="sort-select" id="sort-select">
          <option value="trophies">Sort by Trophies</option>
          <option value="thLevel">Sort by TH Level</option>
        </select>
        <input type="text" class="search-input" id="search-input" placeholder="Search members...">
      </div>

      <div class="members-grid" id="members-grid">
        <!-- JS renders player cards here -->
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <script src="js/components.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/api.js" defer></script>
</body>
</html>
