<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community Events | Inferno Legions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/troops/badge.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background: #050505; color: white;">

  <div id="navbar-placeholder"></div>

  <section class="page-header" style="padding-top: 150px; text-align: center; border-bottom: 2px solid #333; padding-bottom: 50px;">
    <h1 style="font-family: 'Luckiest Guy', cursive; font-size: 4rem; color: #ff9800; text-shadow: 0 5px 15px rgba(255,152,0,0.5);">CLAN EVENTS</h1>
    <p style="font-size: 1.2rem; color: #ccc;">Join the chaos. Win the glory.</p>
  </section>

  <section class="events-content container py-20 text-center">
    <div style="background: rgba(255,255,255,0.05); padding: 50px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
      <h2 style="font-family: 'Luckiest Guy', cursive; font-size: 2.5rem; margin-bottom: 20px;">Upcoming Events</h2>
      <ul style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: 0 auto;">
        <li style="background: rgba(255,152,0,0.1); border: 1px solid rgba(255,152,0,0.3); padding: 20px; border-radius: 12px; text-align: left;">
          <h3 style="font-family: 'Luckiest Guy', cursive; color: #ffeb3b; font-size: 1.5rem; margin-bottom: 5px;">Clan Games Rush</h3>
          <p style="color: #aaa;">Starting this weekend. Minimum 2000 points required from all members.</p>
        </li>
        <li style="background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; text-align: left;">
          <h3 style="font-family: 'Luckiest Guy', cursive; color: white; font-size: 1.5rem; margin-bottom: 5px;">CWL Push (Master I)</h3>
          <p style="color: #aaa;">Next month. Top 15 attackers will be selected. Start practicing your TH16 meta armies.</p>
        </li>
      </ul>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  
  <script src="js/components.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
